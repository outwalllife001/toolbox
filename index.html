<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>开源宝藏工具箱</title>
<meta name="description" content="每天一个免费好用的开源工具，网页打开就能用，文件不上传。">
<style>
  :root { --bg: #f3f5f9; --card: #fff; --ink: #141a26; --sub: #667085; --pri: #2f6bff; --soft: #e8efff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { padding: 28px 16px 8px; text-align: center; }
  h1 { margin: 0; font-size: 26px; }
  header p { margin: 6px 0 0; color: var(--sub); font-size: 14px; }
  main { max-width: 520px; margin: 0 auto; padding: 8px 12px 24px; }
  a.tool { display: block; background: var(--card); border-radius: 18px; padding: 14px 16px; margin: 10px 0; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .row { display: flex; align-items: center; gap: 8px; }
  .day { font-size: 12px; font-weight: 700; color: var(--pri); background: var(--soft); border-radius: 99px; padding: 1px 9px; }
  .name { font-size: 18px; font-weight: 800; }
  .pain { margin: 4px 0 0; font-weight: 600; }
  .desc { margin: 4px 0 0; color: var(--sub); font-size: 14px; }
  .src { margin: 8px 0 0; font-size: 12px; color: var(--sub); }
  footer { text-align: center; color: var(--sub); font-size: 12px; padding: 0 16px 28px; }
</style>
</head>
<body>
<header>
  <h1>开源宝藏工具箱</h1>
  <p>每天挖一个免费好用的开源工具 · 网页打开就能用 · 文件不上传</p>
</header>
<main id="list"></main>
<footer>所有工具都基于开源项目制作，并注明原项目与许可证。</footer>
<script>
fetch('tools.json').then(r => r.json()).then(tools => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('list').innerHTML = tools.slice().reverse().map(t => `
    <a class="tool" href="${esc(t.slug)}/">
      <div class="row"><span class="day">Day ${String(t.day).padStart(2, '0')}</span><span class="name">${esc(t.name)}</span></div>
      <p class="pain">${esc(t.pain)}</p>
      <p class="desc">${esc(t.desc)}</p>
      <p class="src">基于 ${esc(t.source)}（${esc(t.license)}）</p>
    </a>`).join('');
});
</script>
</body>
</html>
